name: Release

# Runs only when you push a version tag (v0.1.0). Creates one draft release,
# then builds Windows, macOS (Apple Silicon + Intel) and Linux installers and
# uploads them straight to it: release files are not Actions storage, and
# nothing is kept as an artifact. Free on public repos (macOS runners
# included). Publish the draft by hand when it looks right.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the draft release and upload to it

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME but package.json says $pkg"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Tests first, so a failing release never leaves an empty draft behind.
      - run: npm ci
      - run: npm test
      # One draft up front, so the three build jobs don't race to create it.
      # (gh release view can't see drafts, so look in the list instead; this
      # way a re-run reuses the draft rather than making a second one.)
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release list --json tagName --jq '.[].tagName' | grep -Fxq "$GITHUB_REF_NAME"; then
            echo "Draft for $GITHUB_REF_NAME already exists; reusing it."
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "Perchlight $GITHUB_REF_NAME" --notes "Unsigned installers; see the README for how to open them."
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and upload to the draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificates (they cost money): installers are
          # unsigned. See the README for what that means on each system.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
