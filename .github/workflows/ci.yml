name: CI

# Free on public repos. Lean anyway: main + pull requests only, docs-only
# changes skipped, older runs cancelled, and nothing is saved as an artifact.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "site/*.html", "site/*.css", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "site/*.html", "site/*.css", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # the tests don't launch Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Reported, not blocking: the dependencies are build/test tools only
      # (nothing ships in the app but Electron), and a new advisory upstream
      # shouldn't turn every push red.
      - run: npm audit --audit-level=high
        continue-on-error: true
